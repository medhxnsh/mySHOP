# Test application configuration — Testcontainers will override DB URL automatically
spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/myshop_test
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Matches the docker-compose default (.env REDIS_PASSWORD); Redisson connects
      # eagerly at context startup, so tests need the real local Redis credentials.
      password: ${REDIS_PASSWORD:change_me_in_production}
  datasource:
    # Testcontainers replaces this URL at runtime with the actual container URL
    url: jdbc:tc:postgresql:16:///myshop_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

# JWT: use short-lived tokens so expiry tests work without long waits
jwt:
  secret: test-secret-key-must-be-exactly-32-chars
  expiration-ms: 900000      # 15 minutes
  refresh-expiration-ms: 604800000

# No Tempo in test runs — don't attempt OTLP export (avoids noisy
# "Failed to export spans" warnings; tracing itself is exercised in the
# docker-compose smoke test).
management:
  tracing:
    enabled: false

logging:
  level:
    com.myshop: DEBUG
    org.testcontainers: INFO
