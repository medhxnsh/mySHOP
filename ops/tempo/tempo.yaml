# Grafana Tempo (single-binary) — trace storage for mySHOP (Phase 7).
# Receives spans over OTLP/HTTP (4318) from the backend's Micrometer
# Tracing → OpenTelemetry exporter; Grafana queries it on 3200.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h # dev retention — keep 2 days of traces
