# Prometheus configuration for mySHOP (Phase 7).
# Scrapes the Spring Boot backend's Micrometer endpoint every 15s.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: myshop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: myshop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
