# Grafana datasource provisioning — created automatically at startup,
# no manual clicking. UIDs are fixed so the committed dashboards can
# reference them stably.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: myshop-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: myshop-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Clicking a traceId in logs/tables jumps straight to the trace.
      tracesToMetrics:
        datasourceUid: myshop-prometheus
